<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04100f">
<title>CODEN — لا تبنِ وحدك</title>
<meta property="og:title" content="CODEN — Find your people. Build together.">
<meta property="og:description" content="انضم لقائمة Early Access واعثر على شريكك المناسب.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04100f;--tl:#19d3b8;--o:#F26B38;--c:#F5F1E8;--m:rgba(245,241,232,.68);--g:rgba(255,255,255,.06);--gb:rgba(255,255,255,.13)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--c);font-family:Cairo,sans-serif;line-height:1.7;overflow-x:hidden}
.en{font-family:Poppins,sans-serif}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,#0a3a36,transparent 60%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.aurora i:nth-child(1){width:520px;height:520px;background:#0e7c6e;opacity:.55;top:-120px;left:-100px;animation:dr 18s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:460px;height:460px;background:var(--o);opacity:.26;top:30%;right:-140px;animation:dr 22s ease-in-out -6s infinite alternate}
.aurora i:nth-child(3){width:560px;height:560px;background:var(--tl);opacity:.2;bottom:-220px;left:25%;animation:dr 26s ease-in-out -12s infinite alternate}
.aurora::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent)}
@keyframes dr{to{transform:translate(80px,60px) scale(1.15)}}
.w{max-width:1080px;margin:0 auto;padding:22px 20px;text-align:start}
header{display:flex;justify-content:space-between;align-items:center}
.logo{font:800 18px Poppins;padding:8px 18px;border-radius:999px;background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(14px)}
.nav{display:flex;gap:10px;align-items:center}
.nav a{font-weight:800;text-decoration:none;font-size:14px;padding:9px 18px;border-radius:999px;background:linear-gradient(135deg,var(--o),#ff9a5c);color:#1a0a03;transition:.2s}
.nav a:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(242,107,56,.45)}
.hero{text-align:center;padding-top:56px}
h1{font-size:clamp(38px,8.5vw,76px);line-height:1.12;margin:0 auto 18px;font-weight:800;max-width:860px;letter-spacing:-.02em;color:#fff}
h1 b{background:linear-gradient(100deg,var(--o),#ffb27a,var(--tl),var(--o));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 7s linear infinite}
@keyframes sweep{to{background-position:-250% 0}}
p.lead{color:var(--m);font-weight:600;max-width:560px;margin:0 auto 44px;font-size:17px}
.stage{position:relative;max-width:460px;margin:0 auto}
.chip{position:absolute;z-index:2;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--gb);backdrop-filter:blur(12px);font-size:13px;font-weight:800;white-space:nowrap;animation:fl 6s ease-in-out var(--d,0s) infinite}
.ch1{top:-18px;inset-inline-start:-70px}.ch2{top:38%;inset-inline-end:-84px;--d:-2s}.ch3{bottom:-14px;inset-inline-start:-46px;--d:-4s}
@keyframes fl{50%{transform:translateY(-10px)}}
.count{position:relative;padding:30px;border-radius:32px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--gb);backdrop-filter:blur(24px);box-shadow:0 30px 80px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.count .n{font:800 clamp(64px,16vw,96px)/1.1 Poppins;letter-spacing:-3px;background:linear-gradient(180deg,#fff,var(--tl));-webkit-background-clip:text;background-clip:text;color:transparent;transition:transform .3s}
.count .n.bump{transform:scale(1.06)}
.count small{color:var(--m);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.count small::before{content:"";width:9px;height:9px;border-radius:50%;background:#2fe38b;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(47,227,139,.6)}70%,100%{box-shadow:0 0 0 10px rgba(47,227,139,0)}}
#feed{margin:22px auto 56px;font-size:13px;color:var(--m);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
#feed i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fe38b;margin-inline-end:8px}
.card{max-width:640px;margin:0 auto;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--gb);backdrop-filter:blur(26px);border-radius:32px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14)}
.card h2{margin:0 0 4px;font-size:24px}
.hint{color:var(--m);font-size:14px;margin:0 0 16px;font-weight:600}
input[type=email],input[type=text],textarea{width:100%;font:600 15px Cairo;padding:14px 18px;border:1px solid var(--gb);border-radius:16px;background:rgba(255,255,255,.05);color:var(--c);margin-bottom:10px;transition:.2s}
::placeholder{color:rgba(245,241,232,.4)}
input:focus,textarea:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 4px rgba(25,211,184,.15)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.opts label{cursor:pointer}.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:block;padding:9px 16px;border:1px solid var(--gb);border-radius:999px;font-size:14px;font-weight:700;background:var(--g);transition:.2s}
.opts label:hover span{border-color:var(--tl);transform:translateY(-2px)}
.opts input:checked+span{background:linear-gradient(135deg,var(--tl),#0fa38f);color:#04100f;border-color:transparent;box-shadow:0 8px 24px rgba(25,211,184,.3)}
.opts input:focus-visible+span{outline:2px solid var(--o);outline-offset:2px}
.q{font-weight:800;font-size:15px;margin:8px 0}
button{width:100%;font:800 16px Cairo;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--o),#ff9a5c);color:#1a0a03;cursor:pointer;box-shadow:0 10px 30px rgba(242,107,56,.35);transition:.2s}
button:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(242,107,56,.5)}
button:active{transform:scale(.98)}
button:disabled{opacity:.6;transform:none}
button.alt,.share button,.lang{background:var(--g);color:var(--c);border:1px solid var(--gb);box-shadow:none;backdrop-filter:blur(10px)}
button.alt{margin-top:8px}
button.alt:hover,.share button:hover,.lang:hover{border-color:var(--tl);box-shadow:none}
.lang{width:auto;padding:8px 16px;border-radius:999px;font:700 13px Poppins}
.share{display:flex;gap:8px;margin-top:12px}
.share input{margin:0;direction:ltr;font-size:12px}
.share button{width:auto;padding:0 20px}
input.hp{position:absolute;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;margin:0!important;border:0!important;opacity:0;overflow:hidden;clip-path:inset(50%);pointer-events:none}
.err{color:#ff8a80;font-size:13px;font-weight:700;min-height:20px}
.hide{display:none!important}
.rank{font:800 60px/1 Poppins;background:linear-gradient(180deg,#fff,var(--o));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--m);margin-bottom:12px;font-weight:600}
.consent input{margin-top:5px}
.sec{margin-top:88px}.sec h2{font-size:clamp(24px,4vw,34px);margin:0 0 18px}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.b{position:relative;overflow:hidden;padding:24px;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--gb);backdrop-filter:blur(18px);transition:transform .3s,border-color .3s}
.b:hover{transform:translateY(-4px);border-color:rgba(25,211,184,.5)}
.b::before{content:"";position:absolute;inset:0;background:radial-gradient(300px circle at var(--x,50%) var(--y,0),rgba(25,211,184,.18),transparent 60%);opacity:0;transition:.3s;pointer-events:none}
.b:hover::before{opacity:1}
.b .ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:var(--g);border:1px solid var(--gb);margin-bottom:14px}
.b h3{margin:0 0 6px;font-size:19px}.b p{margin:0;color:var(--m);font-size:14px;font-weight:600}
.b1{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;justify-content:flex-end;min-height:300px}
.b2{grid-column:span 2}.b5{grid-column:span 4}
.venn{position:absolute;top:28px;inset-inline-end:28px;width:160px;height:96px}
.venn i{position:absolute;top:0;width:96px;height:96px;border-radius:50%;mix-blend-mode:screen;animation:vn 6s ease-in-out infinite alternate}
.venn i:first-child{left:0;background:rgba(25,211,184,.55)}.venn i:last-child{left:64px;background:rgba(242,107,56,.6);animation-direction:alternate-reverse}
@keyframes vn{to{transform:translateX(14px)}}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tl .b{padding:20px}.tl .b:nth-child(1){border-top:3px solid var(--tl)}.tl .b:nth-child(2){border-top:3px solid var(--o)}.tl .b:nth-child(3){border-top:3px solid var(--gb)}
.tl .hint{margin:0;font-size:15px;color:var(--c)}
.note{max-width:720px;margin:0 auto;background:linear-gradient(135deg,rgba(25,211,184,.16),rgba(242,107,56,.1));border:1px solid var(--gb);border-radius:28px;padding:26px;font-size:16px;backdrop-filter:blur(18px)}
.note b{color:var(--o)}
.faq{max-width:720px;margin-inline:auto}
details{border-bottom:1px solid var(--gb);padding:14px 0}
summary{cursor:pointer;font-weight:800;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--tl);font-size:22px;line-height:1;transition:.2s}
details[open] summary::after{transform:rotate(45deg)}
details p{margin:8px 0 0;color:var(--m);font-size:15px}
.pcard{background:linear-gradient(160deg,rgba(25,211,184,.18),rgba(255,255,255,.04));border:1px solid rgba(25,211,184,.4);border-radius:20px;padding:18px;margin:14px 0;text-align:start}
.pcard h4{margin:0 0 4px;font-size:18px}
.pcard .badge{display:inline-block;background:var(--o);color:#1a0a03;border-radius:999px;padding:2px 12px;font:800 12px Poppins;margin-bottom:8px}
.pcard .c{display:inline-block;border:1px solid var(--gb);border-radius:999px;padding:1px 10px;margin:2px;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(2,10,9,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
footer{text-align:center;color:var(--m);font-size:13px;padding:64px 0 30px}
@media(max-width:760px){.bento,.tl{grid-template-columns:1fr}.b1,.b2,.b5{grid-column:auto;grid-row:auto}.b1{min-height:230px}.chip{display:none}.hero{padding-top:36px}}
@media(prefers-reduced-motion:no-preference){@keyframes rise{from{opacity:0;transform:translateY(24px);filter:blur(10px)}}
h1{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}.lead{animation:rise .9s .15s both}.stage{animation:rise .9s .3s both}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Responsive Max ===== */
.count .n{direction:ltr;unicode-bidi:isolate}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:clip;max-width:100%}
img,svg,canvas{max-width:100%}
.w{width:100%;padding-inline:max(20px,env(safe-area-inset-left),env(safe-area-inset-right));padding-top:max(22px,env(safe-area-inset-top))}
h1,h3,.hint,.note,summary,.pcard,#feed,.count small,td{overflow-wrap:anywhere}
h1{font-size:clamp(32px,8vw,76px);line-height:1.18}
p.lead{font-size:clamp(15px,2.4vw,18px)}
.card h2{font-size:clamp(20px,3.2vw,24px)}
input[type=email],input[type=text],textarea{font-size:16px;min-height:48px;min-width:0}
textarea{min-height:96px}
button{min-height:48px}
.opts span{min-height:44px;display:flex;align-items:center}
.lang,.nav a{min-height:40px;display:inline-flex;align-items:center;white-space:nowrap}
.share{flex-wrap:wrap}.share input{flex:1 1 180px;min-width:0}
.modal .card{max-height:90dvh;overflow:auto}
.aurora{height:100lvh}
footer{padding-bottom:max(30px,env(safe-area-inset-bottom))}
@media(hover:none){.b:hover,.opts label:hover span,button:hover,.nav a:hover{transform:none}.b::before{display:none}}

/* wide screens */
@media(min-width:1400px){.w{max-width:1200px}.card{max-width:680px}.hero{padding-top:80px}.stage{max-width:520px}.bento{gap:18px}.b{padding:28px}}
@media(min-width:1800px){.w{max-width:1320px}html{font-size:112%}}

/* laptop / small desktop */
@media(max-width:1024px){.w{max-width:960px}}

/* tablet */
@media(max-width:900px){
  .bento{grid-template-columns:repeat(2,1fr)}
  .b1{grid-column:span 2;grid-row:auto;min-height:240px}
  .b2,.b5{grid-column:span 2}
  .tl{grid-template-columns:1fr}
  .sec{margin-top:64px}
}
@media(max-width:700px){.chip{display:none}}

/* phones */
@media(max-width:760px){
  .bento{grid-template-columns:1fr}
  .b1,.b2,.b5{grid-column:auto}
  .b1{min-height:220px}
  .hero{padding-top:32px}
  p.lead{margin-bottom:32px}
  .card{padding:22px 18px;border-radius:26px}
  .count{padding:24px 16px;border-radius:26px}
  #feed{margin:18px auto 40px}
  .venn{transform:scale(.8);transform-origin:top right}
  .sec{margin-top:52px}
  .note{padding:20px;font-size:15px}
}
@media(max-width:380px){
  .w{padding-inline:14px}
  .logo{padding:6px 12px;font-size:16px}
  .nav{gap:6px}.nav a{padding:8px 12px;font-size:13px}.lang{padding:6px 12px}
  .card{padding:18px 14px}
  .opts{gap:6px}.opts span{padding:8px 12px;font-size:13px}
  .rank{font-size:48px}
  .share button{flex:1 1 100%}
}
@media(max-width:340px){.nav a{display:none}}

/* short landscape phones */
@media(max-height:480px) and (orientation:landscape){.hero{padding-top:16px}p.lead{margin-bottom:20px}.modal{align-items:flex-start;overflow:auto}}

/* ===== CODEN Matching v2 additions ===== */
.match-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.match-grid .full{grid-column:1/-1}
.match-note{font-size:12px;color:var(--m);margin:-5px 0 12px;font-weight:600}
.qsmall{font-size:13px;font-weight:800;margin:10px 0 7px}
textarea{resize:vertical}
@media(max-width:600px){.match-grid{grid-template-columns:1fr}.match-grid .full{grid-column:auto}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="w">
<header><span class="logo">CODEN</span><span class="nav"><button class="lang" id="lang" type="button">EN</button><a href="#join" data-i="cta"></a></span></header>

<section class="hero">
<h1 data-h="h1"></h1>
<p class="lead" data-i="lead"></p>
<div class="stage">
  <span class="chip ch1" data-i="t1"></span><span class="chip ch2" data-i="t2"></span><span class="chip ch3" data-i="t3"></span>
  <div class="count"><div class="n" id="cnt">—</div><small id="cntLabel"></small></div>
</div>
<div id="feed" aria-live="polite"></div>
</section>

<div class="card" id="join">
  <!-- Step 1 -->
  <form id="f1">
    <h2 data-i="f1t"></h2>
    <p class="hint" data-i="f1h"></p>
    <div class="q" data-i="who"></div>
    <div class="opts">
      <label><input type="radio" name="type" value="Founder" required><span data-i="t1"></span></label>
      <label><input type="radio" name="type" value="Developer"><span data-i="t2"></span></label>
      <label><input type="radio" name="type" value="Designer"><span data-i="t3"></span></label>
      <label><input type="radio" name="type" value="Business"><span data-i="t4"></span></label>
      <label><input type="radio" name="type" value="Investor"><span data-i="t6"></span></label>
      <label><input type="radio" name="type" value="Other"><span data-i="t5"></span></label>
    </div>
    <input type="email" id="email" placeholder="you@example.com" dir="ltr" required autocomplete="email">
    <input class="hp" type="text" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label class="consent"><input type="checkbox" id="consent" required><span data-i="consent"></span></label>
    <div class="err" id="e1" role="alert"></div>
    <button id="b1" data-i="b1"></button>
  
</form>

  <!-- Step 2 -->
  <form id="f2" class="hide">
    <div class="rank en" id="rank">#0</div>
    <h2><span data-i="booked"></span> <span id="rank2"></span></h2>
    <p class="hint" data-i="f2h"></p>

    <div class="match-grid">
      <div class="full">
        <input type="text" id="name" data-p="name" maxlength="80" autocomplete="name">
      </div>

      <div class="full">
        <div class="q" data-i="look"></div>
        <div class="opts">
          <label><input type="checkbox" name="look" value="Co-Founder"><span>Co-Founder</span></label>
          <label><input type="checkbox" name="look" value="Developer"><span data-i="t2"></span></label>
          <label><input type="checkbox" name="look" value="Designer"><span data-i="t3"></span></label>
          <label><input type="checkbox" name="look" value="Marketing"><span data-i="mkt"></span></label>
          <label><input type="checkbox" name="look" value="Project"><span data-i="proj"></span></label>
          <label><input type="checkbox" name="look" value="Investor"><span data-i="investor"></span></label>
        </div>
      </div>

      <div>
        <div class="q" data-i="stageQ"></div>
        <div class="opts">
          <label><input type="radio" name="stage" value="Idea"><span data-i="stageIdea"></span></label>
          <label><input type="radio" name="stage" value="Validation"><span data-i="stageValidation"></span></label>
          <label><input type="radio" name="stage" value="MVP"><span data-i="stageMVP"></span></label>
          <label><input type="radio" name="stage" value="Users"><span data-i="stageUsers"></span></label>
          <label><input type="radio" name="stage" value="Revenue"><span data-i="stageRevenue"></span></label>
        </div>
      </div>

      <div>
        <div class="q" data-i="commitQ"></div>
        <div class="opts">
          <label><input type="radio" name="commitment" value="Full-time"><span data-i="fullTime"></span></label>
          <label><input type="radio" name="commitment" value="Part-time"><span data-i="partTime"></span></label>
          <label><input type="radio" name="commitment" value="Flexible"><span data-i="flexible"></span></label>
        </div>
      </div>

      <div>
        <div class="q" data-i="workQ"></div>
        <div class="opts">
          <label><input type="radio" name="workStyle" value="Remote"><span data-i="remote"></span></label>
          <label><input type="radio" name="workStyle" value="Hybrid"><span data-i="hybrid"></span></label>
          <label><input type="radio" name="workStyle" value="In-person"><span data-i="inPerson"></span></label>
        </div>
      </div>

      <div>
        <div class="q" data-i="availabilityQ"></div>
        <div class="opts">
          <label><input type="radio" name="availability" value="0-5"><span data-i="av1"></span></label>
          <label><input type="radio" name="availability" value="5-10"><span data-i="av2"></span></label>
          <label><input type="radio" name="availability" value="10-20"><span data-i="av3"></span></label>
          <label><input type="radio" name="availability" value="20+"><span data-i="av4"></span></label>
        </div>
      </div>

      <div class="full">
        <div class="q" data-i="skillsQ"></div>
        <div class="opts">
          <label><input type="checkbox" name="skills" value="Product"><span>Product</span></label>
          <label><input type="checkbox" name="skills" value="Tech"><span>Tech</span></label>
          <label><input type="checkbox" name="skills" value="Design"><span>Design</span></label>
          <label><input type="checkbox" name="skills" value="Growth"><span>Growth</span></label>
          <label><input type="checkbox" name="skills" value="Sales"><span>Sales</span></label>
          <label><input type="checkbox" name="skills" value="Operations"><span>Operations</span></label>
          <label><input type="checkbox" name="skills" value="Finance"><span>Finance</span></label>
          <label><input type="checkbox" name="skills" value="AI"><span>AI</span></label>
        </div>
      </div>

      <div class="full">
        <div class="q" data-i="vote"></div>
        <div class="opts">
          <label><input type="checkbox" name="feat" value="AI Matching"><span data-i="v1"></span></label>
          <label><input type="checkbox" name="feat" value="Trial Week"><span data-i="v2"></span></label>
          <label><input type="checkbox" name="feat" value="Idea Board"><span data-i="v3"></span></label>
          <label><input type="checkbox" name="feat" value="Investors"><span data-i="v4"></span></label>
          <label><input type="checkbox" name="feat" value="Team Rooms"><span data-i="v5"></span></label>
        </div>

  const box=$("feed");box.textContent="";
  feedData.forEach(f=>{
    const m=Math.max(1,Math.round((Date.now()-f.ts)/6e4));
    const u=m<60?m+(L==="ar"?" د":"m"):m<1440?Math.round(m/60)+(L==="ar"?" س":"h"):Math.round(m/1440)+(L==="ar"?" ي":"d");
    const d=document.createElement("div"),i=document.createElement("i");
    d.append(i,(TYPE[f.type]?t(TYPE[f.type]):"")+(f.city?" · "+f.city:"")+" — "+(L==="ar"?"منذ "+u:u+" ago"));
    box.append(d);

}

    await set(ref(db,"waitlist/"+key),{
      email,userType:document.querySelector('input[name=type]:checked').value,
      token,code,consent:true,lang:L,
      ref:qs.get("ref")||"",
      utm:qs.get("utm_source")||"",
      utmMedium:qs.get("utm_medium")||"",
      utmCampaign:qs.get("utm_campaign")||"",
      utmContent:qs.get("utm_content")||"",
      landingVariant:qs.get("variant")||"default",
      profileCompleted:false,
      matchReady:false,
      status:"new",
      ts:Date.now(),
      updatedAt:Date.now()
    });
  }catch(err){
    $("e1").textContent=String(err).includes("PERMISSION")?t("dup"):t("err");
    $("b1").disabled=false;return;
  }
  try{const r=await runTransaction(ref(db,"stats/count"),c=>(c||0)+1);rank=r.snapshot.val()}catch{rank="—"}
  prof.type=document.querySelector("input[name=type]:checked").value;
  localStorage.setItem("coden_prof",JSON.stringify(prof));
  const rc=qs.get("ref");
  if(rc&&/^[0-9a-f]{8}$/.test(rc))runTransaction(ref(db,"refs/"+rc),c=>(c||0)+1).catch(()=>{});
  set(ref(db,"feed/"+Date.now()+"-"+code),{type:prof.type,ts:Date.now()}).catch(()=>{});
  localStorage.setItem("coden_reg",JSON.stringify({key,token,code,rank}));
  $("rank").textContent="#"+rank;$("rank2").textContent="#"+rank;
  $("f1").classList.add("hide");$("f2").classList.remove("hide");
});

const finish=()=>{
  const url=location.origin+location.pathname+"?ref="+code;
  $("link").value=url;
  const msg=t("share")+url;
  $("wa").onclick=()=>open("https://wa.me/?text="+encodeURIComponent(msg));
  $("li").onclick=()=>open("https://www.linkedin.com/sharing/share-offsite/?url="+encodeURIComponent(url));
  $("tw").onclick=()=>open("https://twitter.com/intent/tweet?text="+encodeURIComponent(msg));
  $("f2").classList.add("hide");$("done").classList.remove("hide");
  watchRefs();updatePrio();renderCard();
};
function updatePrio(){
  const n=Number(rank),ok=Number.isFinite(n);
  $("rank3").textContent="#"+(ok?Math.max(1,n-refs*5):rank);
  $("prio").textContent=refs>0?t("prio").replace("{n}",Math.min(refs*5,ok?n-1:0)):"";
}
function watchRefs(){
  if(watching)return;watching=true;
  onValue(ref(db,"refs/"+code),s=>{refs=s.val()||0;updatePrio()});
}
function renderCard(){
  const p=$("pcard");p.textContent="";
  const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=txt;return e};
  p.append(mk("div","badge en","Early Founder #"+rank),mk("h4","",prof.name||"—"),mk("div","",TYPE[prof.type]?t(TYPE[prof.type]):""));
  if((prof.look||[]).length){p.append(mk("div","",t("lookL")+":"));prof.look.forEach(x=>p.append(mk("span","c",x)))}
  (prof.feat||[]).forEach(x=>p.append(mk("span","c",x)));
}
$("sc").onclick=async()=>{
  await document.fonts.load("800 100px Poppins");
  const c=document.createElement("canvas");c.width=c.height=1080;const x=c.getContext("2d");
  x.fillStyle="#004643";x.fillRect(0,0,1080,1080);
  x.fillStyle="#F26B38";x.beginPath();x.arc(960,120,240,0,7);x.fill();
  x.fillStyle="#F5F1E8";x.textAlign="left";
  x.font="800 64px Poppins";x.fillText("CODEN",80,150);
  x.font="600 42px Poppins";x.fillText("Early Founder",80,520);
  x.font="800 230px Poppins";x.fillText("#"+rank,80,750);
  x.font="600 40px Poppins";x.fillText((prof.name||"").slice(0,26)+(prof.type?" - "+prof.type:""),80,850);
  x.fillText("Find your people. Build together.",80,980);
  const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="coden-early-founder.png";a.click();
};
$("skip").onclick=async()=>{try{if(key)await update(ref(db,"waitlist/"+key),{profileCompleted:false,matchReady:false,updatedAt:Date.now()})}catch{}finish()};
$("copy").onclick=()=>{navigator.clipboard.writeText($("link").value);$("copy").textContent=t("copied")};

$("f2").addEventListener("submit",async e=>{
  e.preventDefault();$("b2").disabled=true;$("e2").textContent="";
  const checked=n=>[...document.querySelectorAll(`input[name="${n}"]:checked`)].map(i=>i.value);
  const one=n=>(document.querySelector(`input[name="${n}"]:checked`)||{}).value||"";
  const payload={
    token,
    name:$("name").value.trim().slice(0,80),
    lookingFor:checked("look"),
    features:checked("feat"),
    stage:one("stage"),
    commitment:one("commitment"),
    workStyle:one("workStyle"),
    availability:one("availability"),
    skills:checked("skills"),
    wtp:one("wtp"),
    problem:$("problem").value.trim().slice(0,500),
    goldenAnswer:$("golden").value.trim().slice(0,500),
    projectDescription:$("projectDescription").value.trim().slice(0,1500),
    offer:$("offer").value.trim().slice(0,800),
    idealPartner:$("idealPartner").value.trim().slice(0,1000),
    compensationExpectation:one("comp"),
    riskTolerance:one("risk"),
    experienceLevel:one("exp"),
    startupExperience:one("su"),
    communicationStyle:one("comm"),
    hardConstraints:$("hardConstraints").value.trim().slice(0,500),
    location:$("location").value.trim().slice(0,80),
    contact:$("contact").value.trim().slice(0,120),
    shareConsent:$("shareConsent").checked,
    timezone:(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch{return ""}})(),
    projectName:$("projectName").value.trim().slice(0,100),
    category:one("category"),
    profileCompleted:true,
    matchReady:true,
    updatedAt:Date.now()
  };
  try{
    await update(ref(db,"waitlist/"+key),payload);
    prof={
      ...prof,
      name:payload.name,look:payload.lookingFor,feat:payload.features,
      stage:payload.stage,commitment:payload.commitment,workStyle:payload.workStyle,
      availability:payload.availability,skills:payload.skills,
      wtp:payload.wtp,projectName:payload.projectName,category:payload.category
    };
    localStorage.setItem("coden_prof",JSON.stringify(prof));
    finish();
  }catch{$("e2").textContent=t("saveErr");$("b2").disabled=false}
});

document.querySelectorAll(".b").forEach(c=>c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();c.style.setProperty("--x",e.clientX-r.left+"px");c.style.setProperty("--y",e.clientY-r.top+"px")}));
let exitShown=false;
document.addEventListener("mouseleave",e=>{
  if(e.clientY<=0&&!exitShown&&!key&&!localStorage.getItem("coden_reg")){exitShown=true;$("exit").classList.remove("hide")}
});
$("exX").onclick=()=>$("exit").classList.add("hide");
$("exGo").onclick=()=>{$("exit").classList.add("hide");$("join").scrollIntoView({behavior:"smooth"});$("email").focus()};

try{
  const r=JSON.parse(localStorage.getItem("coden_reg")||"null");
  if(r){({key,token,code,rank}=r);prof=JSON.parse(localStorage.getItem("coden_prof")||"{}");
    $("rank").textContent=$("rank2").textContent="#"+rank;$("f1").classList.add("hide");finish();}
}catch{}
</script>
</body>
</html>
